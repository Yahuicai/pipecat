<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试练习助手</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #4361ee;
    --primary-hover: #3a56d4;
    --danger: #ef476f;
    --success: #06d6a0;
    --text: #2b2d42;
    --text-muted: #8d99ae;
    --border: #e0e0e0;
    --radius: 12px;
    --sidebar-w: 360px;
    --sidebar-min: 200px;
    --sidebar-max: 600px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ---------- left sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-min);
    max-width: var(--sidebar-max);
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px 16px 12px;
    font-size: 15px;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .sidebar-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 24px 8px;
  }
  .record-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    font-size: 13px;
  }
  .record-header {
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafbfc;
    user-select: none;
  }
  .record-header:hover { background: #f0f2f5; }
  .record-title { font-weight: 600; font-size: 12px; }
  .record-toggle { font-size: 11px; color: var(--text-muted); }
  .record-body {
    display: none;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    max-height: 500px;
    overflow-y: auto;
  }
  .record-body.open { display: block; }
  .record-q { margin-bottom: 12px; }
  .record-q-title { font-weight: 600; color: var(--primary); margin-bottom: 2px; }
  .record-q-prompt { color: var(--text); margin-bottom: 4px; }
  .record-q-answer { color: var(--text-muted); margin-bottom: 4px; white-space: pre-wrap; }
  .record-q-ref { color: var(--success); margin-bottom: 2px; white-space: pre-wrap; font-size: 12px; }
  .record-q-ref-label { font-weight: 600; color: #059669; font-size: 12px; }
  .record-feedback-label { font-weight: 600; margin-top: 8px; margin-bottom: 2px; color: var(--danger); }
  .record-feedback { color: var(--text); white-space: pre-wrap; }
  .record-elapsed { font-size: 11px; color: var(--text-muted); }
  .record-delete-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 14px; padding: 0 4px;
    line-height: 1; transition: color .2s;
  }
  .record-delete-btn:hover { color: var(--danger); }

  /* ---------- stats panel ---------- */
  .stats-panel {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .stats-title {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .stats-total-bar-wrap {
    background: var(--border);
    border-radius: 4px;
    height: 8px;
    margin-bottom: 6px;
  }
  .stats-total-bar {
    background: var(--primary);
    border-radius: 4px;
    height: 100%;
    transition: width .5s;
  }
  .stats-cat { margin-bottom: 4px; }
  .stats-cat-label {
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .stats-cat-bar-wrap {
    background: var(--border);
    border-radius: 3px;
    height: 5px;
  }
  .stats-cat-bar {
    background: var(--success);
    border-radius: 3px;
    height: 100%;
    transition: width .5s;
  }

  /* ---------- feedback sections ---------- */
  .feedback-sections { display: none; flex-direction: column; gap: 10px; }
  .feedback-sections.visible { display: flex; }
  .fb-section {
    border-radius: 8px;
    padding: 12px 14px;
  }
  .fb-section-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .fb-section-body {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .fb-overall { background: #eff6ff; }
  .fb-overall .fb-section-title { color: #1d4ed8; }
  .fb-strength { background: #f0fdf4; }
  .fb-strength .fb-section-title { color: #15803d; }
  .fb-issue { background: #fff7ed; }
  .fb-issue .fb-section-title { color: #c2410c; }
  .fb-advice { background: #faf5ff; }
  .fb-advice .fb-section-title { color: #7e22ce; }

  /* ---------- resize handle ---------- */
  .resize-handle {
    width: 5px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    transition: background .2s;
    position: relative;
  }
  .resize-handle:hover,
  .resize-handle.active {
    background: var(--primary);
    opacity: .3;
  }

  /* ---------- main area ---------- */
  .main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 32px 24px;
    overflow-y: auto;
    height: 100vh;
  }
  .container { width: 100%; max-width: 720px; }

  h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 24px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    padding: 24px;
    margin-bottom: 16px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-muted);
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ccc;
    display: inline-block;
    margin-right: 6px;
    transition: background .3s;
  }
  .status-dot.connected { background: var(--success); }
  .status-dot.error { background: var(--danger); }

  .progress-bar { display: flex; gap: 8px; margin: 16px 0; }
  .progress-step {
    flex: 1; height: 6px; border-radius: 3px;
    background: var(--border); transition: background .4s;
  }
  .progress-step.done { background: var(--success); }
  .progress-step.active { background: var(--primary); }

  .question-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .question-label { font-size: 13px; color: var(--text-muted); }
  .timer {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    min-width: 50px;
    text-align: right;
    display: none;
  }
  .timer.visible { display: inline-block; }
  .reading-hint {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    display: none;
  }
  .reading-hint.visible { display: inline-block; }

  .question-area {
    min-height: 80px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafbfc;
    white-space: pre-wrap;
  }

  .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 14px 0; font-size: 16px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #d63d60; }

  .section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text); }

  .completed-questions { display: none; }
  .completed-questions.visible { display: block; }
  .cq-item {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: #fafbfc;
  }
  .cq-title { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
  .cq-prompt { font-size: 13px; color: var(--text); margin-bottom: 4px; }
  .cq-answer-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .cq-answer { font-size: 13px; color: var(--text); white-space: pre-wrap; margin-bottom: 6px; }
  .cq-ref-label { font-size: 12px; font-weight: 600; color: #059669; margin-bottom: 2px; }
  .cq-ref { font-size: 13px; color: #065f46; white-space: pre-wrap; background: #ecfdf5; padding: 8px; border-radius: 6px; display: none; }
  .cq-ref.visible { display: block; }

  .feedback-card { display: none; }
  .feedback-card.visible { display: block; }
  .feedback-area {
    min-height: 100px;
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafbfc;
  }
  .feedback-streaming::after {
    content: "▌";
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }

  .transcript-label { font-size: 12px; color: var(--text-muted); margin-top: 12px; margin-bottom: 4px; }
  .transcript-area {
    font-size: 13px; color: var(--text-muted);
    min-height: 40px; padding: 12px;
    border: 1px dashed var(--border); border-radius: 8px;
    margin-top: 4px; white-space: pre-wrap;
  }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100% !important; min-width: 100% !important; max-width: 100% !important;
      height: auto; max-height: 40vh;
      position: relative; border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .resize-handle { display: none; }
    .main { height: auto; min-height: 60vh; }
  }
</style>
</head>
<body>

<!-- ====== LEFT SIDEBAR ====== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">历史练习记录</div>
  <div class="stats-panel" id="statsPanel">
    <div class="stats-title">
      <span>题库覆盖</span>
      <span id="statsTotalText" style="color:var(--text-muted)">加载中...</span>
    </div>
    <div class="stats-total-bar-wrap">
      <div class="stats-total-bar" id="statsTotalBar" style="width:0%"></div>
    </div>
    <div id="statsCats"></div>
  </div>
  <div class="sidebar-list" id="historyList">
    <div class="sidebar-empty" id="historyEmpty">暂无记录</div>
  </div>
</aside>

<!-- ====== RESIZE HANDLE ====== -->
<div class="resize-handle" id="resizeHandle"></div>

<!-- ====== MAIN AREA ====== -->
<div class="main">
<div class="container">
  <h1>面试练习助手</h1>

  <div class="card">
    <div class="status-bar">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">未连接</span></span>
      <span id="progressText">等待开始</span>
    </div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-step" id="step0"></div>
      <div class="progress-step" id="step1"></div>
      <div class="progress-step" id="step2"></div>
    </div>
  </div>

  <div class="card">
    <div class="question-header">
      <span class="question-label" id="questionLabel">题目区域</span>
      <span>
        <span class="reading-hint" id="readingHint">题目朗读中...</span>
        <span class="timer" id="timer">00:00</span>
      </span>
    </div>
    <div class="question-area" id="questionArea">点击「开始练习」后，系统将抽取三道题目依次进行练习。</div>
    <div class="transcript-label">实时语音识别：</div>
    <div class="transcript-area" id="transcriptArea">——</div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px;color:var(--text-muted)">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none">
        <input type="checkbox" id="showQuestionToggle" checked style="width:16px;height:16px;accent-color:var(--primary)">
        <span>显示题目文字</span>
      </label>
      <span style="font-size:12px;opacity:.7">（取消勾选可模拟真实面试）</span>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="btnStart" disabled>开始练习</button>
      <button type="button" class="btn btn-danger" id="btnDone" disabled>答题完毕</button>
    </div>
  </div>

  <div class="card completed-questions" id="completedSection">
    <div class="section-title">已完成题目</div>
    <div id="completedList"></div>
  </div>

  <div class="card feedback-card" id="feedbackCard">
    <div class="section-title">总点评</div>
    <div class="feedback-area" id="feedbackArea"></div>
    <div class="feedback-sections" id="feedbackSections">
      <div class="fb-section fb-overall">
        <div class="fb-section-title">总体表现</div>
        <div class="fb-section-body" id="fbOverall"></div>
      </div>
      <div class="fb-section fb-strength">
        <div class="fb-section-title">亮点</div>
        <div class="fb-section-body" id="fbStrength"></div>
      </div>
      <div class="fb-section fb-issue">
        <div class="fb-section-title">主要问题</div>
        <div class="fb-section-body" id="fbIssue"></div>
      </div>
      <div class="fb-section fb-advice">
        <div class="fb-section-title">改进建议</div>
        <div class="fb-section-body" id="fbAdvice"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

const statusDot = $("statusDot");
const statusText = $("statusText");
const progressText = $("progressText");
const questionLabel = $("questionLabel");
const questionArea = $("questionArea");
const transcriptArea = $("transcriptArea");
const feedbackArea = $("feedbackArea");
const feedbackCard = $("feedbackCard");
const feedbackSections = $("feedbackSections");
const completedSection = $("completedSection");
const completedList = $("completedList");
const timerEl = $("timer");
const readingHint = $("readingHint");
const btnStart = $("btnStart");
const btnDone = $("btnDone");
const historyList = $("historyList");
const historyEmpty = $("historyEmpty");
const sidebar = $("sidebar");
const resizeHandle = $("resizeHandle");

let pc = null;
let dc = null;
let localStream = null;
let pingInterval = null;

let timerInterval = null;
let timerStart = null;
let showQuestion = true;

const showQuestionToggle = $("showQuestionToggle");
showQuestionToggle.addEventListener("change", () => {
  showQuestion = showQuestionToggle.checked;
});

function setStatus(state, text) {
  statusDot.className = "status-dot " + state;
  statusText.textContent = text;
}

function updateProgress(current, total, label) {
  progressText.textContent = label || `第 ${current}/${total} 题`;
  for (let i = 0; i < 3; i++) {
    const el = $("step" + i);
    el.className = "progress-step";
    if (i < current - 1) el.classList.add("done");
    else if (i === current - 1) el.classList.add("active");
  }
}

/* ---------- Timer ---------- */
function startTimer() {
  stopTimer();
  readingHint.classList.remove("visible");
  timerStart = Date.now();
  timerEl.textContent = "00:00";
  timerEl.style.color = "var(--primary)";
  timerEl.title = "";
  timerEl.classList.add("visible");
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const ss = String(elapsed % 60).padStart(2, "0");
    timerEl.textContent = mm + ":" + ss;
    if (elapsed >= 300) {
      timerEl.style.color = "var(--danger)";
      timerEl.title = "答题时间过长，建议尽快收尾";
    } else if (elapsed >= 180) {
      timerEl.style.color = "#f77f00";
      timerEl.title = "已超过建议时长（3分钟）";
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerEl.classList.remove("visible");
}

function getElapsedSecs() {
  return timerStart ? Math.floor((Date.now() - timerStart) / 1000) : 0;
}

/* ---------- Resize sidebar ---------- */
(function initResize() {
  let startX, startW;
  resizeHandle.addEventListener("mousedown", e => {
    e.preventDefault();
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    resizeHandle.classList.add("active");
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  function onMove(e) {
    const delta = e.clientX - startX;
    const minW = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sidebar-min"));
    const maxW = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sidebar-max"));
    const newW = Math.max(minW, Math.min(maxW, startW + delta));
    sidebar.style.width = newW + "px";
  }
  function onUp() {
    resizeHandle.classList.remove("active");
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
})();

/* ---------- Friendly date ---------- */
function friendlyDate(title) {
  // title format: "2026-04-12 16:24:42"
  const m = title.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  if (!m) return title;
  const [, yr, mo, dy, hh, mm] = m;
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const yesterday = new Date(now - 86400000);
  const yd = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,"0")}-${String(yesterday.getDate()).padStart(2,"0")}`;
  const dateStr = `${yr}-${mo}-${dy}`;
  const time = `${hh}:${mm}`;
  if (dateStr === today) return `今天 ${time}`;
  if (dateStr === yd) return `昨天 ${time}`;
  return `${parseInt(mo)}月${parseInt(dy)}日 ${time}`;
}

/* ---------- Stats panel ---------- */
async function loadStats() {
  try {
    const resp = await fetch("/api/stats");
    const s = await resp.json();
    const pct = s.total ? Math.round(s.practiced / s.total * 100) : 0;
    $("statsTotalText").textContent = `已练 ${s.practiced}/${s.total} · ${pct}%`;
    $("statsTotalBar").style.width = pct + "%";
    const catsEl = $("statsCats");
    catsEl.innerHTML = "";
    s.categories.forEach(c => {
      const cpct = c.total ? Math.round(c.practiced / c.total * 100) : 0;
      const div = document.createElement("div");
      div.className = "stats-cat";
      div.innerHTML = `
        <div class="stats-cat-label">
          <span>${esc(c.name)}</span>
          <span>${c.practiced}/${c.total}</span>
        </div>
        <div class="stats-cat-bar-wrap">
          <div class="stats-cat-bar" style="width:${cpct}%"></div>
        </div>`;
      catsEl.appendChild(div);
    });
  } catch (e) {
    console.warn("Failed to load stats", e);
  }
}

/* ---------- History sidebar ---------- */
async function loadHistory() {
  try {
    const resp = await fetch("/api/records");
    const records = await resp.json();
    if (!records.length) {
      historyEmpty.style.display = "block";
      return;
    }
    historyEmpty.style.display = "none";
    historyList.querySelectorAll(".record-item").forEach(el => el.remove());
    records.forEach(r => {
      const item = document.createElement("div");
      item.className = "record-item";
      let bodyHtml = "";
      r.questions.forEach((q, i) => {
        bodyHtml += `<div class="record-q">
          <div class="record-q-title">第${i+1}题【${esc(q.category)}】${q.elapsed ? `<span class="record-elapsed"> · ${esc(q.elapsed)}</span>` : ""}</div>
          <div class="record-q-prompt">${esc(q.prompt)}</div>
          <div class="record-q-answer">回答：${esc(q.answer)}</div>`;
        if (q.reference_answer) {
          bodyHtml += `<div class="record-q-ref-label">参考答案：</div>
            <div class="record-q-ref">${esc(q.reference_answer)}</div>`;
        }
        bodyHtml += `</div>`;
      });
      if (r.feedback) {
        bodyHtml += `<div class="record-feedback-label">总点评</div><div class="record-feedback">${esc(r.feedback)}</div>`;
      }
      item.innerHTML = `
        <div class="record-header">
          <span class="record-title">${esc(friendlyDate(r.title))}</span>
          <span style="display:flex;align-items:center;gap:6px">
            <span class="record-toggle">展开</span>
            <button type="button" class="record-delete-btn" title="删除记录">×</button>
          </span>
        </div>
        <div class="record-body">${bodyHtml}</div>`;
      const header = item.querySelector(".record-header");
      const body = item.querySelector(".record-body");
      const toggle = item.querySelector(".record-toggle");
      const deleteBtn = item.querySelector(".record-delete-btn");
      header.addEventListener("click", e => {
        if (e.target === deleteBtn) return;
        const open = body.classList.toggle("open");
        toggle.textContent = open ? "收起" : "展开";
      });
      deleteBtn.addEventListener("click", async e => {
        e.preventDefault();
        e.stopPropagation();
        if (!confirm(`确定删除这条记录吗？\n${r.title}`)) return;
        try {
          await fetch(`/api/records/${encodeURIComponent(r.filename)}`, { method: "DELETE" });
          item.remove();
          if (!historyList.querySelector(".record-item")) {
            historyEmpty.style.display = "block";
          }
          loadStats();
        } catch (err) {
          alert("删除失败：" + err);
        }
      });
      historyList.appendChild(item);
    });
  } catch (e) {
    console.warn("Failed to load history", e);
  }
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

/* ---------- Feedback section parser ---------- */
function parseFeedbackSections(text) {
  const tags = ["总体表现", "亮点", "主要问题", "改进建议"];
  const ids = ["fbOverall", "fbStrength", "fbIssue", "fbAdvice"];
  const parts = {};
  let current = null;
  for (const line of text.split("\n")) {
    const tagMatch = tags.find(t => line.includes(`[${t}]`));
    if (tagMatch) {
      current = tagMatch;
      parts[current] = (line.replace(`[${current}]`, "").trim());
    } else if (current) {
      parts[current] += "\n" + line;
    }
  }
  const filled = tags.filter(t => parts[t] && parts[t].trim());
  if (filled.length < 2) return; // not enough sections, keep raw text
  feedbackArea.style.display = "none";
  tags.forEach((t, i) => {
    if (parts[t]) $(ids[i]).textContent = parts[t].trim();
  });
  feedbackSections.classList.add("visible");
}

/* ---------- RTVI messaging ---------- */
function sendRTVIMessage(type, data) {
  if (!dc || dc.readyState !== "open") return;
  const msg = {
    label: "rtvi-ai",
    type: "client-message",
    id: crypto.randomUUID(),
    data: { t: type, d: data || null }
  };
  dc.send(JSON.stringify(msg));
}

/* ---------- Completed questions ---------- */
const cqElements = {};
let currentQuestionMeta = {};

function addCompletedQuestion(index, category, prompt, answer) {
  completedSection.classList.add("visible");
  const item = document.createElement("div");
  item.className = "cq-item";
  item.setAttribute("data-index", index);
  item.innerHTML = `
    <div class="cq-title">第${index}题【${esc(category)}】</div>
    <div class="cq-prompt">${esc(prompt)}</div>
    <div class="cq-answer-label">我的回答：</div>
    <div class="cq-answer">${esc(answer)}</div>`;
  completedList.appendChild(item);
  cqElements[index] = item;
}

function updateReferenceAnswer(index, text) {
  const item = cqElements[index];
  if (!item) return;
  // Lazily create ref section the first time answer arrives
  let refEl = document.getElementById("cqRef" + index);
  if (!refEl) {
    const label = document.createElement("div");
    label.className = "cq-ref-label";
    label.textContent = "参考答案：";
    refEl = document.createElement("div");
    refEl.className = "cq-ref";
    refEl.id = "cqRef" + index;
    item.appendChild(label);
    item.appendChild(refEl);
  }
  refEl.textContent = text;
  refEl.classList.add("visible");
}

/* ---------- Server message handler ---------- */
function handleServerMessage(msg) {
  if (msg.type === "server-message" && msg.data) {
    const d = msg.data;
    switch (d.type) {
      case "progress":
        updateProgress(d.current, d.total, d.label);
        break;
      case "question":
        currentQuestionMeta = { index: d.index, category: d.category, prompt: d.text };
        questionLabel.textContent = `第${d.index}题【${d.category}】`;
        questionArea.textContent = showQuestion ? d.text : "（真实面试模式：题目已隐藏，请认真听题）";
        transcriptArea.textContent = "——";
        readingHint.classList.add("visible");
        timerEl.classList.remove("visible");
        break;
      case "waiting_answer":
        btnDone.disabled = false;
        startTimer();
        break;
      case "transcript":
        // Only update during answering state (btnDone enabled); discard stale frames
        if (!btnDone.disabled) transcriptArea.textContent = d.text || "——";
        break;
      case "answer_transcript":
        addCompletedQuestion(
          d.index,
          currentQuestionMeta.category || "",
          currentQuestionMeta.prompt || "",
          d.text
        );
        stopTimer();
        break;
      case "reference_answer":
        updateReferenceAnswer(d.index, d.text);
        break;
      case "generating_feedback":
        btnDone.disabled = true;
        stopTimer();
        readingHint.classList.remove("visible");
        questionLabel.textContent = "总点评生成中...";
        questionArea.textContent = "正在根据你的回答生成总点评和参考答案，请稍候...";
        transcriptArea.textContent = "——";
        feedbackCard.classList.add("visible");
        feedbackArea.textContent = "";
        feedbackArea.classList.add("feedback-streaming");
        break;
      case "feedback_chunk":
        feedbackArea.textContent += d.text;
        feedbackArea.scrollTop = feedbackArea.scrollHeight;
        break;
      case "feedback_done":
        feedbackArea.classList.remove("feedback-streaming");
        parseFeedbackSections(feedbackArea.textContent);
        questionLabel.textContent = "练习完成";
        questionArea.textContent = "本轮练习已结束，总点评和参考答案已生成。";
        progressText.textContent = "已完成";
        for (let i = 0; i < 3; i++) $("step" + i).className = "progress-step done";
        loadHistory();
        loadStats();
        break;
      case "feedback":
        feedbackCard.classList.add("visible");
        feedbackArea.textContent = d.text;
        feedbackArea.classList.remove("feedback-streaming");
        parseFeedbackSections(d.text);
        questionLabel.textContent = "练习完成";
        questionArea.textContent = "本轮练习已结束，总点评已生成。";
        progressText.textContent = "已完成";
        for (let i = 0; i < 3; i++) $("step" + i).className = "progress-step done";
        loadHistory();
        loadStats();
        break;
      case "session_ready":
        btnStart.disabled = false;
        setStatus("connected", "已就绪，可开始新一轮练习");
        break;
      case "error":
        questionArea.textContent = "出错了：" + (d.text || "未知错误");
        break;
    }
  }
  if (msg.type === "bot-ready") {
    btnStart.disabled = false;
    setStatus("connected", "已就绪");
  }
}

/* ---------- WebRTC connect ---------- */
async function connect() {
  setStatus("", "连接中...");
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus("error", "无法获取麦克风");
    return;
  }

  pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.addTransceiver("audio", { direction: "recvonly" });

  const remoteAudio = new Audio();
  remoteAudio.autoplay = true;
  pc.ontrack = e => { remoteAudio.srcObject = e.streams[0]; };

  dc = pc.createDataChannel("chat");
  dc.onopen = () => {
    setStatus("connected", "已连接");
    pingInterval = setInterval(() => { if (dc.readyState === "open") dc.send("ping"); }, 1000);
    setTimeout(() => {
      dc.send(JSON.stringify({
        label: "rtvi-ai",
        type: "client-ready",
        id: crypto.randomUUID(),
        data: { version: "1.2.0" }
      }));
    }, 500);
  };
  dc.onmessage = e => {
    try { handleServerMessage(JSON.parse(e.data)); } catch {}
  };
  dc.onclose = () => {
    setStatus("", "已断开");
    clearInterval(pingInterval);
  };

  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed") {
      setStatus("error", "连接断开");
      clearInterval(pingInterval);
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise(r => {
    if (pc.iceGatheringState === "complete") r();
    else pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === "complete") r(); };
  });

  const resp = await fetch("/api/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
  });
  const answer = await resp.json();
  await pc.setRemoteDescription(new RTCSessionDescription({ sdp: answer.sdp, type: answer.type }));
}

/* ---------- Button handlers ---------- */
btnStart.addEventListener("click", () => {
  btnStart.disabled = true;
  completedList.innerHTML = "";
  Object.keys(cqElements).forEach(k => delete cqElements[k]);
  completedSection.classList.remove("visible");
  feedbackCard.classList.remove("visible");
  feedbackArea.textContent = "";
  feedbackArea.style.display = "";
  feedbackSections.classList.remove("visible");
  sendRTVIMessage("start_practice");
});

btnDone.addEventListener("click", () => {
  btnDone.disabled = true;
  const elapsed = getElapsedSecs();
  stopTimer();
  sendRTVIMessage("done_answering", { elapsed_secs: elapsed });
});

/* ---------- Init ---------- */
loadHistory();
loadStats();
connect();
</script>
